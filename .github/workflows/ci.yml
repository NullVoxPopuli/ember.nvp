name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

##############################################################

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOME: /tmp/home
  WORKSPACE: /tmp/workspace

jobs:
  lints:
    name: "Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: wyvox/action@v1
      - run: pnpm lint

  babel_8:
    name: "Node Tests (@babel/core 8)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: wyvox/action@v1
      # The plugin packages accept Babel 7 and 8, and the lockfile resolves 7.
      # The blueprint fixtures still need 7 (ember-cli-babel, broccoli), so the
      # bump is scoped to the three packages that declare the wider range.
      - run: |
          cat >> pnpm-workspace.yaml <<'EOF'

          overrides:
            "@nullvoxpopuli/ember-build-tooling-utils>@babel/core": "^8.0.0"
            "@nullvoxpopuli/ember-rolldown>@babel/core": "^8.0.0"
            "@nullvoxpopuli/ember-rolldown>@babel/plugin-transform-typescript": "^8.0.0"
            "@nullvoxpopuli/ember-vite>@babel/core": "^8.0.0"
            "@nullvoxpopuli/ember-vite>@babel/plugin-transform-typescript": "^8.0.0"
          EOF
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test:node packages/

  check_layers:
    name: "Node Tests (check-layer permutations)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: wyvox/action@v1
      - run: |
          git config --global user.name "ci"
          git config --global user.email "non@none.none"
          pnpm test:node test/ember.nvp/permutations/*-checks.test.ts

  node_tests:
    name: "Node Tests (${{ matrix.slice.name }})"
    # Skip the matrix when a fast job fails.
    needs: [lints, babel_8, check_layers]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # vitest runs one test file per worker, and a runner has 4 CPUs (3 workers).
    # So each permutation job runs 3 slice files, and no job runs only one.
    strategy:
      fail-fast: false
      matrix:
        slice:
          - name: app permutations 1/6
            args: >-
              test/ember.nvp/permutations/app-1.test.ts test/ember.nvp/permutations/app-2.test.ts test/ember.nvp/permutations/app-3.test.ts
          - name: app permutations 2/6
            args: >-
              test/ember.nvp/permutations/app-4.test.ts test/ember.nvp/permutations/app-5.test.ts test/ember.nvp/permutations/app-6.test.ts
          - name: app permutations 3/6
            args: >-
              test/ember.nvp/permutations/app-7.test.ts test/ember.nvp/permutations/app-8.test.ts test/ember.nvp/permutations/app-9.test.ts
          - name: app permutations 4/6
            args: >-
              test/ember.nvp/permutations/app-10.test.ts test/ember.nvp/permutations/app-11.test.ts test/ember.nvp/permutations/app-12.test.ts
          - name: app permutations 5/6
            args: >-
              test/ember.nvp/permutations/app-13.test.ts test/ember.nvp/permutations/app-14.test.ts test/ember.nvp/permutations/app-15.test.ts
          - name: app permutations 6/6
            args: >-
              test/ember.nvp/permutations/app-16.test.ts test/ember.nvp/permutations/app-17.test.ts test/ember.nvp/permutations/app-18.test.ts
          - name: extension permutations 1/3
            args: >-
              test/ember.nvp/permutations/extension-1.test.ts test/ember.nvp/permutations/extension-2.test.ts test/ember.nvp/permutations/extension-3.test.ts
          - name: extension permutations 2/3
            args: >-
              test/ember.nvp/permutations/extension-4.test.ts test/ember.nvp/permutations/extension-5.test.ts test/ember.nvp/permutations/extension-6.test.ts
          - name: extension permutations 3/3
            args: >-
              test/ember.nvp/permutations/extension-7.test.ts test/ember.nvp/permutations/extension-8.test.ts test/ember.nvp/permutations/extension-9.test.ts
          - name: library, custom-element, widget permutations
            args: >-
              test/ember.nvp/permutations/library-1.test.ts test/ember.nvp/permutations/library-2.test.ts test/ember.nvp/permutations/custom-element-1.test.ts test/ember.nvp/permutations/custom-element-2.test.ts test/ember.nvp/permutations/widget-1.test.ts test/ember.nvp/permutations/widget-2.test.ts
          - name: everything else 1/2
            args: >-
              --exclude 'test/ember.nvp/permutations/**' --shard=1/2
          - name: everything else 2/2
            args: >-
              --exclude 'test/ember.nvp/permutations/**' --shard=2/2

    steps:
      - uses: wyvox/action@v1
      - run: |
          git config --global user.name "ci"
          git config --global user.email "non@none.none"
          pnpm test:node ${{ matrix.slice.args }}
